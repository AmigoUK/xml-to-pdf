name: Release binaries

# PyInstaller does not cross-compile, so each platform's executable is built on
# that platform. Pushing a v* tag builds them and attaches them to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true

permissions:
  contents: write
  # Build provenance is signed through Sigstore, which needs an OIDC token.
  # It does not remove the OS "unknown publisher" prompt — nothing free does —
  # but it lets anyone verify a download really came from this repo and tag:
  #   gh attestation verify xml-to-pdf-windows-x64.exe --repo AmigoUK/xml-to-pdf
  id-token: write
  attestations: write

jobs:
  # workflow_dispatch input is user-controlled, so it is validated once here and
  # only the checked value is passed on. Downstream jobs never interpolate the
  # raw input into a shell command or a ref.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Refusing tag '$RAW_TAG': expected a vMAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils zbar-tools fonts-dejavu-core python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest tests/ -q

  build:
    needs: [resolve, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ships the bare .exe: one click, and no permission bit to lose.
          - os: windows-latest
            asset: xml-to-pdf-windows-x64.exe
            built: dist/xml-to-pdf.exe
            archive: false
          # Unix binaries ship as tarballs. A release asset carries no POSIX
          # permissions, so a bare download arrives as -rw-r--r-- and needs
          # chmod +x; a tarball preserves the executable bit.
          - os: ubuntu-latest
            asset: xml-to-pdf-linux-x64.tar.gz
            built: dist/xml-to-pdf
            archive: true
          - os: macos-latest          # Apple silicon
            asset: xml-to-pdf-macos-arm64.tar.gz
            built: dist/xml-to-pdf
            archive: true
          - os: macos-13              # Intel
            asset: xml-to-pdf-macos-x64.tar.gz
            built: dist/xml-to-pdf
            archive: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Windows and macOS have no system DejaVu, and the renderer requires it,
      # so the faces are fetched and bundled into the executable.
      - name: Fetch DejaVu Sans
        run: python scripts/fetch_fonts.py fonts

      - name: Build
        run: pyinstaller --clean --noconfirm xml-to-pdf.spec

      - name: Smoke-test the executable
        shell: bash
        env:
          BUILT: ${{ matrix.built }}
        run: |
          "$BUILT" --version
          "$BUILT" example_invoice.xml -o smoke.pdf --config british_english
          test -s smoke.pdf || { echo "no PDF produced" >&2; exit 1; }
          echo "Produced $(wc -c < smoke.pdf) bytes"

      - name: Package for the release
        shell: bash
        env:
          BUILT: ${{ matrix.built }}
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          if [ "$ARCHIVE" = "true" ]; then
            cp "$BUILT" xml-to-pdf
            chmod +x xml-to-pdf
            tar -czf "$ASSET" xml-to-pdf
          else
            cp "$BUILT" "$ASSET"
          fi
          ls -l "$ASSET"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$REPO"

  checksums:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write SHA256SUMS.txt
        run: |
          find artifacts -type f -exec mv {} . \;
          sha256sum xml-to-pdf-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$REPO"
